<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#171b3b">
  <title>MZTI 帽子查询</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f9fafb;color:#1f2937}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f9fafb}.app{width:min(100%,680px);min-height:100vh;margin:auto;padding:24px 16px;display:flex;flex-direction:column}.home{position:relative;isolation:isolate;justify-content:flex-end;align-items:center;text-align:center;min-height:100vh;margin:-24px -16px;padding:0 16px 50px;overflow:hidden;color:#fff}.cover,.overlay{position:absolute;inset:0;z-index:-2}.cover{width:100%;height:100%;object-fit:cover;background:linear-gradient(135deg,#667eea,#764ba2)}.overlay{z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,.1),rgba(0,0,0,.3) 50%,rgba(0,0,0,.6))}.eyebrow{display:none}.home h1{font-size:2rem;line-height:1.35;margin:0 0 10px;font-weight:700;letter-spacing:1px}.home p{margin:0;color:rgba(255,255,255,.8);font-size:1.1rem}.notice{display:block;font-size:.75rem;color:#9ca3af;margin-top:16px}.home .notice{color:#fff;margin-top:22px}.btn{min-height:48px;border:0;border-radius:12px;background:#3b82f6;color:#fff;font-size:1rem;font-weight:500;padding:12px 18px;cursor:pointer}.btn:hover{background:#2563eb}.btn:active{transform:scale(.99)}.start{width:200px;min-height:50px;margin-top:32px;border-radius:25px;background:linear-gradient(135deg,#667eea,#764ba2);box-shadow:0 4px 13px rgba(102,126,234,.6);font-weight:700;font-size:.95rem}.start:hover{background:linear-gradient(135deg,#667eea,#764ba2)}.top{display:flex;justify-content:space-between;align-items:center;color:#4b5563;font-size:.875rem;margin:0 0 8px}.top span:last-child{color:#3b82f6;font-weight:500}.bar{height:8px;background:#e5e7eb;border-radius:999px;overflow:hidden}.bar>i{display:block;height:100%;border-radius:inherit;background:#3b82f6;transition:width .2s}.card{background:#fff;border:0;border-radius:12px;padding:16px;margin-top:24px;box-shadow:0 1px 2px rgba(0,0,0,.04)}.question{font-size:1.125rem;line-height:1.65;margin:0 0 24px;font-weight:600}.option{width:100%;min-height:58px;margin:10px 0;text-align:left;border:2px solid #e5e7eb;background:#fff;color:#374151;border-radius:12px;padding:14px 16px;cursor:pointer;font-size:1rem;transition:.15s}.option:hover,.option.selected{background:#eff6ff;border-color:#3b82f6;color:#1d4ed8}.actions{display:flex;gap:12px;margin-top:20px}.actions .btn{flex:1}.secondary{background:#fff;color:#374151;border:1px solid #d1d5db}.secondary:hover{background:#f9fafb}.secondary:disabled{opacity:.45;cursor:not-allowed}.result-header{text-align:center;margin-bottom:24px}.badge{width:80px;height:80px;margin:0 auto 16px;display:grid;place-items:center;border-radius:50%;font-size:1.5rem;font-weight:700}.result-name{font-size:1.5rem;margin:0;color:#1f2937}.code{letter-spacing:.08em;color:#9ca3af;margin:6px 0 0;font-size:.75rem}.tags{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:14px}.tag{border:1px solid currentColor;border-radius:999px;padding:4px 10px;font-size:.75rem}.card h2{font-size:1.125rem;margin:0 0 14px}.description{color:#374151;line-height:1.7;font-size:.875rem;margin:0 0 16px}.quote{border:0;background:#f9fafb;border-radius:8px;margin:0;padding:12px;color:#6b7280;font-style:normal;font-size:.875rem}.quote strong{display:block;font-size:.875rem;color:#6b7280;font-weight:400;margin-bottom:5px}.dim{margin:16px 0}.dim:last-child{margin-bottom:0}.dim-head{display:flex;justify-content:space-between;font-size:.875rem;margin-bottom:6px;color:#4b5563}.dim-head span:nth-child(2){font-size:.75rem;color:#9ca3af}.dim-track{height:8px;border-radius:999px;background:#e5e7eb;display:flex;overflow:hidden}.dim-track i{height:100%;border-radius:999px}.dim-track .right{margin-left:auto}.portrait{width:100%;min-height:300px;border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center}.portrait img{width:100%;height:auto;max-height:400px;object-fit:contain;display:block}.result-actions{margin-top:24px}.result-actions .btn{width:100%}.hidden{display:none}@media(max-width:420px){.app{padding:24px 16px}.home{margin:-24px -16px;padding-bottom:50px}.card{padding:16px}.question{font-size:1.1rem}}
  </style>
</head>
<body><main id="app" class="app"></main>
<script>
const prompts=[
"本土品牌就是比外来品牌靠谱","富人区的学校比穷人区好三倍，这不是市场是劫掠","你觉得这片土地的文明底色就是主体族群","听人说职场环境对女性不太友好，你觉得言过其实了","出了事你习惯先看看其他视角怎么报","你觉得创业赚的钱就该是自己的","承认差异比假装看不见更诚实","你觉得同样的能力女性要证明两次","外媒对自家事指指点点你就来气","你觉得穷不是懒是命","有人说主体族群只是五十六分之一你不同意","相亲时对方要求有房你觉得太现实了","朋友移民了你理解甚至有点羡慕","工资条扣了三分之一税你觉得心疼","你觉得文化越多样越有生命力","“她太敏感了”这五个字本身就是问题","留学回来的人说话带着优越感让你不舒服","遗产税应该再高一点","大一统是你心里最了不起的事","当有人提到女性的不易时你觉得男性也有男性的不易","国产的东西总是差那么一口气","补贴和配额只会养懒","你觉得没有哪一种文化天生就该是主角","你觉得很多“理所当然”背后藏着对女性的不公平","自家的成就不需要别处来盖章","你觉得有人生下来就站在终点线上","传统节日你带孩子回了祠堂上香","你觉得现在反倒是男的更吃亏","你刷到外面的生活觉得更向往","同一条起跑线够了之后的路自己走","你觉得共同记忆比共同血统更重要","你觉得沉默不是中立是纵容","国外的奖没有含金量","你在医院挂了最便宜的号然后想到有人连这个都挂不起","你觉得主体文化让步已经够多了","公司提拔了五个主管全是男的你觉得没什么问题","你觉得外面的制度确实有值得学的","富人拿到的也是自己拼出来的","融合换个词就是消失","闺蜜说升职被跳过了你觉得该看看是不是只有男的升了"];
const dims=['godRabbit','leftRight','emperorGroup','maleFemale'];
const questions=prompts.map((question,i)=>({question,dimension:dims[i%4],positive:Math.floor(i/4)%2===0}));
const options=[['strongly_agree','非常赞同'],['agree','赞同'],['neutral','中立'],['disagree','不赞同'],['strongly_disagree','非常不赞同']];
const score={strongly_agree:2,agree:1,neutral:0,disagree:-1,strongly_disagree:-2};
const types={
NEHT:['铁血粉红','#C41E3A',['本土优先','平等优先','汉本位','传统秩序'],'红色正统的守旗者。相信国家应把资源倾斜给弱者，重视根脉与秩序。'],NEHF:['赤色铁拳','#DC143C',['本土优先','平等优先','汉本位','性别自觉'],'一边守着民族和阶级的立场，一边清醒地看到性别天平是歪的。'],NEPT:['基本盘','#B22222',['本土优先','平等优先','多元共生','传统秩序'],'国族认同强，但民族是共同体；相信资源要向弱者倾斜。'],NEPF:['温柔铁拳','#E34234',['本土优先','平等优先','多元共生','性别自觉'],'相信国家要保护弱者；批判不是否定，而是想让它更好。'],NLHT:['社达赢家','#8B4513',['本土优先','自由优先','汉本位','传统秩序'],'国家要强，钱归自己，重视根脉与传统秩序。'],NLHF:['大女主','#CD853F',['本土优先','自由优先','汉本位','性别自觉'],'相信市场也看到市场对不同性别并不总是公平。'],NLPT:['日子人','#D2691E',['本土优先','自由优先','多元共生','传统秩序'],'相信钱归自己，但民族是大家的事；稳当，也不退让。'],NLPF:['清醒姐','#DAA520',['本土优先','自由优先','多元共生','性别自觉'],'相信国家与市场，但追求经过修正、对所有人都公平的自由。'],XEHT:['反思哥','#1E3A5F',['崇外慕洋','平等优先','汉本位','传统秩序'],'觉得外面的制度有可学处，同时重视弱者、根脉与秩序。'],XEHF:['孤狼姐','#2E4A6F',['崇外慕洋','平等优先','汉本位','性别自觉'],'对体制、市场、民族叙事、性别结构同时保持警觉。'],XEPT:['理中客','#3E5A7F',['崇外慕洋','平等优先','多元共生','传统秩序'],'相信外面有可学之处、资源要倾斜，民族是共同体。'],XEPF:['觉醒姐','#4E6A8F',['崇外慕洋','平等优先','多元共生','性别自觉'],'对各种不平等保持警觉，强调每个人都不该被定义。'],XLHT:['慕强哥','#708090',['崇外慕洋','自由优先','汉本位','传统秩序'],'用强者逻辑统一对制度、财富、根脉与秩序的看法。'],XLHF:['精致利己','#778899',['崇外慕洋','自由优先','汉本位','性别自觉'],'向往外面的制度、相信市场，也看到性别天平并不平整。'],XLPT:['润人','#87CEEB',['崇外慕洋','自由优先','多元共生','传统秩序'],'对体制有距离，对市场有信仰，对多元有耐心。'],XLPF:['世界姐','#B0C4DE',['崇外慕洋','自由优先','多元共生','性别自觉'],'希望所有人都能不被定义，并对市场与结构保持清醒。']};
let step=0,answers=[];const app=document.querySelector('#app');
function home(){app.innerHTML=`<section class="home"><img class="cover" src="https://coze-coding-project.tos.coze.site/coze_storage_7643803301204656162/share_preview_83e7a120.jpg?sign=1815629050-c272f37720-0-3f926dc2e02da6484150c07176068ed14936a8f3331dfa6fd9261556f9132e92" alt=""><div class="overlay"></div><h1>MZTI 帽子查询</h1><p>探寻你的思想坐标</p><button class="btn start" id="start">天冷了戴顶帽子吧</button><div class="notice">内容虚构 仅供娱乐</div></section>`;document.querySelector('#start').onclick=quiz}
function quiz(){const q=questions[step],chosen=answers[step];app.innerHTML=`<div class="top"><span>题目 ${step+1} / ${questions.length}</span><span>${Math.round((step+1)/questions.length*100)}%</span></div><div class="bar"><i style="width:${(step+1)/questions.length*100}%"></i></div><section class="card"><h2 class="question">${q.question}</h2>${options.map(([value,label])=>`<button class="option ${chosen===value?'selected':''}" data-value="${value}">${label}</button>`).join('')}<div class="actions"><button class="btn secondary" id="prev" ${step===0?'disabled':''}>上一题</button><button class="btn" id="next">${step===questions.length-1?'查看结果':'下一题'}</button></div></section><p class="notice" style="text-align:center">内容虚构，仅供娱乐</p>`;document.querySelectorAll('.option').forEach(el=>el.onclick=()=>{answers[step]=el.dataset.value;quiz()});document.querySelector('#prev').onclick=()=>{if(step){step--;quiz()}};document.querySelector('#next').onclick=()=>{if(!answers[step])return alert('请选择一个选项');if(step<questions.length-1){step++;quiz()}else result()}}
function result(){const s={godRabbit:0,leftRight:0,emperorGroup:0,maleFemale:0};answers.forEach((a,i)=>s[questions[i].dimension]+=score[a]*(questions[i].positive?1:-1));const code=(s.godRabbit>=0?'N':'X')+(s.leftRight>=0?'E':'L')+(s.emperorGroup>=0?'H':'P')+(s.maleFemale>=0?'T':'F');const uncertain=[['神/兔',s.godRabbit],['左/右',s.leftRight],['皇/团',s.emperorGroup],['男/女',s.maleFemale]].filter(([,v])=>Math.abs(v)<=2).map(([n])=>n);const [name,color,tags,description]=types[code];const rows=[['神/兔',100-Math.round((20+s.godRabbit)/40*100),'神',Math.round((20+s.godRabbit)/40*100),'兔'],['左/右',100-Math.round((20+s.leftRight)/40*100),'右',Math.round((20+s.leftRight)/40*100),'左'],['皇/团',100-Math.round((20+s.emperorGroup)/40*100),'团',Math.round((20+s.emperorGroup)/40*100),'皇'],['男/女',100-Math.round((20+s.maleFemale)/40*100),'女',Math.round((20+s.maleFemale)/40*100),'男']];app.innerHTML=`<section class="result-header"><div class="badge" style="background:${color}20;color:${color}">${code}</div><h1 class="result-name">${name}</h1><p class="code">${code}</p><div class="tags" style="color:${color}">${tags.map(t=>`<span class="tag" style="background:${color}15">${t}</span>`).join('')}</div></section><section class="card"><h2>四维坐标</h2>${rows.map(([title,leftValue,left,rightValue,right])=>{const mid=leftValue>=45&&leftValue<=55;const leftWins=leftValue>rightValue;const active=mid?'#f59e0b':color;return `<div class="dim"><div class="dim-head"><span style="color:${leftWins||mid?active:'#9ca3af'}">${left} ${leftValue}%</span><span>${title}${mid?' (X)':''}</span><span style="color:${!leftWins||mid?active:'#9ca3af'}">${right} ${rightValue}%</span></div><div class="dim-track">${leftWins?`<i style="width:${leftValue}%;background:${active}"></i>`:`<i class="right" style="width:${rightValue}%;background:${active}"></i>`}</div></div>`}).join('')}</section><section class="card"><h2>流派解读</h2>${uncertain.length?`<p class="notice">未定型维度：${uncertain.join('、')}</p>`:''}<p class="description">${description}</p><p class="quote"><strong>口头禅</strong><span style="color:${color}">“结果只是一次轻松的自我观察，不是对任何人的定义。”</span></p></section><section class="card"><h2>流派立绘</h2><div class="portrait" style="background:${color}10"><span style="font-size:2.5rem">🎭</span></div></section><div class="result-actions"><button id="again" class="btn secondary">重新查询</button></div><p class="notice" style="text-align:center">内容虚构 仅供娱乐</p>`;document.querySelector('#again').onclick=()=>{step=0;answers=[];quiz()}}
home();
</script></body></html>
