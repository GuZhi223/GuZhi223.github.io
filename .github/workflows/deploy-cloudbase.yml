name: Deploy to CloudBase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      clean_deploy:
        description: Delete the CloudBase /guzhi223 directory before deploying
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: cloudbase-hosting-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TCB_ENV_ID: guzhi223-d1g8bie1p67d34918
      TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
      TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
      CLOUD_PATH: /guzhi223
      DEPLOY_MANIFEST_URL: https://guzhi223-d1g8bie1p67d34918-1363634311.tcloudbaseapp.com/guzhi223/.deploy-manifest.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for CloudBase path
        run: npm run build
        env:
          VITE_BASE_PATH: /guzhi223/

      - name: Check dist links
        run: npm run check:dist

      - name: Install CloudBase CLI
        run: npm install -g @cloudbase/cli

      - name: Validate CloudBase secrets
        run: |
          missing=0
          for name in TENCENTCLOUD_SECRET_ID TENCENTCLOUD_SECRET_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured. Add it in GitHub repository Settings > Secrets and variables > Actions."
              missing=1
            fi
          done
          exit "$missing"

      - name: Login to CloudBase
        run: tcb login --apiKeyId "$TENCENTCLOUD_SECRET_ID" --apiKey "$TENCENTCLOUD_SECRET_KEY"

      - name: Check hosting status
        run: tcb hosting detail --env-id "$TCB_ENV_ID"

      - name: Download previous deploy manifest
        run: curl --fail --silent --show-error "$DEPLOY_MANIFEST_URL?cachebust=$GITHUB_SHA" --output previous-deploy-manifest.json || true

      - name: Clean CloudBase directory
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.clean_deploy == 'true' }}
        run: tcb hosting delete "$CLOUD_PATH" --dir --env-id "$TCB_ENV_ID" --yes

      - name: Plan CloudBase deployment
        id: deploy-plan
        env:
          FORCE_FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.clean_deploy == 'true' }}
        run: |
          args=(previous-deploy-manifest.json)
          if [ "$FORCE_FULL" = "true" ]; then
            args+=(--force-full)
          fi
          node scripts/plan-cloudbase-deploy.mjs "${args[@]}"
          node -e '
            const plan = require("./.deploy-plan/plan.json");
            for (const [key, value] of Object.entries(plan)) {
              console.log(`${key}=${value}`);
            }
          ' >> "$GITHUB_OUTPUT"

      - name: Show deployment plan
        run: cat .deploy-plan/plan.json

      - name: Deploy all files to CloudBase Hosting
        if: ${{ steps.deploy-plan.outputs.mode == 'full' }}
        run: |
          for attempt in 1 2 3; do
            echo "Full deploy attempt $attempt"
            if tcb hosting deploy dist "$CLOUD_PATH" --env-id "$TCB_ENV_ID" --yes; then
              exit 0
            fi
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            sleep $((attempt * 20))
          done

      - name: Deploy changed files to CloudBase Hosting
        if: ${{ steps.deploy-plan.outputs.mode == 'incremental' && steps.deploy-plan.outputs.changedFiles != '0' }}
        run: |
          mkdir -p .deploy-changed
          while IFS= read -r relative_path; do
            if [ -n "$relative_path" ]; then
              target_path=".deploy-changed/$relative_path"
              mkdir -p "$(dirname "$target_path")"
              cp "dist/$relative_path" "$target_path"
              echo "Staged $relative_path"
            fi
          done < .deploy-plan/changed.txt

          for attempt in 1 2 3; do
            echo "Incremental batch deploy attempt $attempt"
            if tcb hosting deploy .deploy-changed "$CLOUD_PATH" --env-id "$TCB_ENV_ID" --yes; then
              exit 0
            fi
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done

      - name: Delete removed files from CloudBase Hosting
        if: ${{ steps.deploy-plan.outputs.deletedFiles != '0' }}
        run: |
          while IFS= read -r relative_path; do
            if [ -n "$relative_path" ]; then
              echo "Deleting $relative_path"
              tcb hosting delete "$CLOUD_PATH/$relative_path" --env-id "$TCB_ENV_ID" --yes
            fi
          done < .deploy-plan/deleted.txt

      - name: Verify deployment
        run: |
          curl --fail --silent --show-error --head "https://guzhi223-d1g8bie1p67d34918-1363634311.tcloudbaseapp.com/guzhi223/"
          curl --fail --silent --show-error --head "https://guzhi223-d1g8bie1p67d34918-1363634311.tcloudbaseapp.com/guzhi223/projects/data-structure-quiz/"
